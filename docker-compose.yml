# Local development stack: the bot plus a CPU speech-to-text service.
# The LLM is NOT started here: point SCROLLKEEPER_LLM_BASE_URL (in .env) at any
# OpenAI-compatible server (vLLM, llama.cpp, Ollama's /v1, ...).
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SCROLLKEEPER_STT_BASE_URL: http://stt:9000/v1
    volumes:
      - ./data:/app/data
    depends_on:
      - stt
    restart: unless-stopped

  stt:
    build:
      context: docker/stt
    environment:
      STT_THREADS: ${STT_THREADS:-3}
    restart: unless-stopped
